[package]
name = "manta-block-ring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared-memory ring between rust-bhyve and the MantaBlock engine (spec 37)"

# rust-bhyve depends on this crate too, so it has no dependencies.
[dependencies]

[dev-dependencies]
proptest.workspace = true

# The workspace forbids unsafe code. Only `ring.rs`, which reads and writes
# the shared mapping, allows it; everywhere else it stays denied.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
