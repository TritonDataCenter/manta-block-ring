[package]
name = "manta-block-ring"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MPL-2.0"
authors = ["Triton DataCenter"]
repository = "https://github.com/TritonDataCenter/manta-block-ring"
description = "Shared-memory ring between rust-bhyve and the MantaBlock engine"
keywords = ["nvme", "ring", "shared-memory", "bhyve"]
categories = ["os", "concurrency"]

# Keep empty: rust-bhyve and the engine both build this crate.
[dependencies]

[dev-dependencies]
proptest = "1"

# Only `ring.rs` allows unsafe code.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
